name: astrbot_plugin_ear
display_name: 耳朵 · 真听觉
short_desc: 让只会读文字的模型真的听见声音（QQ 语音 / 抖音）
desc: |
  让只会读文字的模型**真的听见**语音——不是先转成文字，而是直接听声音本身。
  收到语音时，先用一个能听音频的多模态模型（默认通义千问 Omni）听一遍，
  得到「说了什么、什么语气、语速快慢、有没有背景声」的描述，再把它作为临时上下文交给主模型。
  人格、记忆、说话方式都还是原来那个人，只是多了一只耳朵。

  附带可视化视图：可直接在 WebUI 里改配置、查看每一条语音的听取记录。
  支持任何 OpenAI 兼容、且支持音频输入的端点（DashScope / 硅基流动 等）。
version: "0.5.0"
author: fy
repo: https://github.com/zKL200/astrbot_plugin_ear
astrbot_version: ">=4.13"
support_platforms:
  - aiocqhttp
tags:
  - audio
  - voice
  - omni
  - hearing
  - douyin
