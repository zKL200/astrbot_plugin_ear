name: astrbot_plugin_ear
display_name: 世界的声音
desc: |
  让只会读文字的模型真正听见声音——不是转成文字，而是听语气、听停顿、听背景。

  QQ 语音：用能听音频的多模态模型（默认通义千问 Omni）听一遍，写成第一人称的听感，
  同时把这段声音画成声谱图，一起注入临时上下文。人格、记忆、说话方式都不变，只是多了一只耳朵。

  抖音作品：可截取播放器真实音频轨，听出讲解内容、背景音乐与情绪；声谱图会在下一轮补进去。

  只在私聊、只对主人生效；带每日次数上限；下载、转码、调模型全程不阻塞事件循环。
  接口地址可配，兼容任何支持音频输入的 OpenAI 兼容端点。
short_desc: 让只会读文字的模型听见声音本身
version: "0.6.1"
author: fy
repo: https://github.com/zKL200/astrbot_plugin_ear
entry: main.py
astrbot_version: ">=4.13"
support_platforms:
  - aiocqhttp
